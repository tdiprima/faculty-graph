[project]
name = "faculty-graph"
version = "0.1.0"
description = "harvests public faculty publication data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7.1", "python-dotenv>=1.0.0"]

[project.optional-dependencies]
review = ["pyyaml>=6.0"]
all = ["pyyaml>=6.0"]
# rdflib parses generated Turtle in the converter tests; without it those
# tests skip rather than fail.
dev = ["pytest>=8.0", "pyyaml>=6.0", "rdflib>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
